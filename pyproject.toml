[project]
name = "audio-deepfake-detector"
version = "0.1.0"
description = "Detecting AI-generated and cloned voices: a deep learning system for robust audio deepfake detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# CPU-only ML/audio dependencies for pretrained Wav2Vec2 deepfake detector
# integration/benchmarking (Phase 2), plus the Streamlit presentation layer
# (Phase 3). torch/torchaudio are installed separately from the PyTorch CPU
# wheel index (https://download.pytorch.org/whl/cpu) — see README.md setup
# instructions; they are NOT resolvable from PyPI alone with the +cpu build
# tag. requirements.txt at the repo root mirrors these pins for Streamlit
# Community Cloud deployment and must be kept logically consistent with
# this list.
dependencies = [
    "torch>=2.13,<3",
    "torchaudio>=2.11,<3",
    "transformers>=5.15,<6",
    "huggingface_hub>=1.28,<2",
    "safetensors>=0.8,<1",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "soundfile>=0.14,<1",
    "librosa>=1.0,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "PyYAML>=6.0,<7",
    "psutil>=7.2,<8",
    "streamlit>=1.62,<2",
    "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Test-only: extracts text from generated PDF reports to assert on
    # their content (app/reporting/pdf_report.py). NOT part of
    # requirements.txt / the Streamlit Community Cloud deployment.
    "pypdf>=5.0",
]
# Dev/research-only dependencies for Phase 4 calibration experiments
# (docs/inference_calibration.md). NOT part of requirements.txt / the
# Streamlit Community Cloud deployment — calibration is an offline research
# workflow, not a runtime dependency of the deployed app.
calibration = [
    "webrtcvad-wheels>=2.0,<3",
    "datasets>=3.0,<4",
    "pyarrow>=17.0",
    "scikit-learn>=1.5,<2",
]
# CPU-only ONNX Runtime investigation (docs/replacement_model_evaluation.md,
# "ONNX Rescue Investigation" section). NOT part of requirements.txt / the
# Streamlit Community Cloud deployment unless the ONNX candidate is later
# selected — this is a research-only dependency for the fairseq-avoidance
# experiment. onnxruntime (CPU build) only; never onnxruntime-gpu.
onnx = [
    "onnxruntime>=1.20,<2",
    "onnx>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: real model download/load/inference tests (network + large downloads required)",
    "slow: tests that take a long time to run and are excluded from the default suite",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
