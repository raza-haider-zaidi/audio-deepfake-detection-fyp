[project]
name = "audio-deepfake-detector"
version = "0.1.0"
description = "Detecting AI-generated and cloned voices: a deep learning system for robust audio deepfake detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Phase 1: no runtime dependencies pinned yet. ML/audio/UI dependencies
# (torch, torchaudio, transformers, streamlit, etc.) are added when the
# MVP pretrained-model integration begins, not during environment setup.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
